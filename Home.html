  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOME</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/Clint/assest/css/Home.css">
</head>
<body>
    <button class="back-btn" id="backToMain">&larr;</button>
    <div class="game-wrapper"> <br>
        <br>
        <div class="top-controls">
            <div class="left-controls">
                <button class="small-btn" id="pauseBtn">
                    <i class="fas fa-pause"></i> Pause
                </button>
                <button class="small-btn" id="soundBtn">
                    <i class="fas fa-volume-up"></i> Sound
                </button>
            </div>
            
            <div class="right-controls">
                <div class="game-header">
                    <div class="score-display">
                        <div class="score-item ball-score">
                            <i class="fas fa-circle"></i>
                            <span id="ballScore">0</span>
                        </div>
                        <div class="score-item star-score">
                            <i class="fas fa-star"></i>
                            <span id="starScore">0</span>
                        </div>
                    </div>
                    <div class="level-display">
                        <span>Level</span>
                        <span id="level">1</span>
                    </div>
                    <div class="lives-display" id="lives"></div>
                </div>
            </div>
        </div>
        
        <div class="game-container">
            <canvas id="gameCanvas"></canvas>
            
            <div class="game-overlay" id="gameStart">
                <h1 class="game-title">Ball Mania Enhanced</h1>
            </div>
            
            <div class="game-overlay" id="gameOver">
                <h1 class="game-title">Game Over</h1>
                <div class="final-score">
                    <div>Ball Score: <span id="finalBallScore">0</span></div>
                    <div>Star Score: <span id="finalStarScore">0</span></div>
                </div>
                <button class="small-btn" id="restartBtn" style="width: 150px;">
                    <i class="fas fa-redo"></i> Play Again
                </button>
            </div>
            
            <div class="game-overlay" id="levelComplete">
                <h1 class="game-title">Level Complete!</h1>
                <div class="final-score">
                    <div>Ball Score: <span id="levelBallScore">0</span></div>
                    <div>Star Score: <span id="levelStarScore">0</span></div>
                </div>
                <button class="small-btn" id="nextLevelBtn" style="width: 150px;">
                    <i class="fas fa-arrow-right"></i> Next Level
                </button>
            </div>
            
            <div class="game-overlay" id="pausedScreen">
                <h1 class="game-title">Game Paused</h1>
                <button class="small-btn" id="resumeBtn" style="width: 150px;">
                    <i class="fas fa-play"></i> Resume
                </button>
            </div>
            
            <div class="game-overlay" id="retryScreen">
                <h1 class="game-title">Try Again!</h1>
                <div class="final-score">
                    <div>Lives Left: <span id="livesLeft">3</span></div>
                </div>
                <button class="small-btn" id="retryBtn" style="width: 150px;">
                    <i class="fas fa-redo"></i> Retry Level
                </button>
            </div>
        </div>
        
        <div class="start-game-btn-container">
            <button class="start-game-btn" id="startBtn">
                <i class="fas fa-play"></i> Start Game
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"> </script>
    <script src="/Clint/assest/js/Home.js">  </script>
    <script>
    const API_BASE_URL_SAVE_DATA = 'http://toant.store/api/game/save-data';
    async function saveScore(playerName, ballScore, starScore, level) {
            const token = localStorage.getItem('token'); 

            if (!token) {
                console.error('Error: No authentication token found. User not logged in or token missing.');
                return null; 
            }

            const parsedBallScore = parseFloat(ballScore);
            const parsedStarScore = parseFloat(starScore);
            const parsedLevel = parseFloat(level);

            if (!playerName || typeof playerName !== 'string' || playerName.trim() === '' ||
                isNaN(parsedBallScore) || isNaN(parsedStarScore) || isNaN(parsedLevel) ||
                parsedBallScore < 0 || parsedStarScore < 0 || parsedLevel < 0) {
                console.error('Invalid game data provided to saveScore function. Data:', { playerName, ballScore, starScore, level });
                return null;
            }

            const response = await fetch(API_BASE_URL_SAVE_DATA, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    playerName: playerName,
                    level: parsedLevel,
                    points: parsedBallScore,
                    stars: parsedStarScore
                }),
            });

            if (response.ok) {
                const result = await response.json();
                console.log('Score saved successfully:', result);
                return result;
            } else {
                console.error('Failed to save score. Server responded with status:', response.status, response.statusText);
                let errorMessage = 'An unknown error occurred.';
                try {
                    const errorData = await response.json();
                    errorMessage = errorData.message || JSON.stringify(errorData);
                } catch (jsonError) {
                    errorMessage = await response.text();
                }
                console.error('Server error details:', errorMessage);
                return null;
            }
        } catch (error) {
            console.error('Error saving score (network or fetch issue):', error);
            return null;
        }
    }
    
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>
  <link rel="stylesheet" href="/Clint/assest/css/dashboard.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <header class="topbar">
    <button id="menuToggle" class="hamburger">&#9776;</button>
    <div class="topbar-title">MyDashboard</div>
    <input class="search-ber" type="text" id="searchInput" placeholder="Search here..." />
  </header>

  <div class="container">
    <aside class="sidebar" id="sidebar">
      <nav class="menu">
        <a href="#" class="menu-item"onclick="Dashboard(event)">Dashboard Overview</a>
        <a href="#" class="menu-item" onclick="Home(event)">Home</a>
        <a href="#" class="menu-item" onclick="Leaderboards(event)">Leaderboard</a>
        <a href="#" class="menu-item" onclick="friend(event)">Friend</a>
        <a href="#" class="menu-item" onclick="Tasks(event)">Tasks</a>
        <a href="#" class="menu-item" onclick="wallets(event)">Wallet</a>
        <a href="#" class="menu-item" onclick="Game(event)">Game and Earn</a>
        <a href="#" class="menu-item" onclick="downlode(event)"> Download App</a>
        <a href="#" class="menu-item" onclick="support(event)" >Get Support</a>
      </nav>
      <button id="toggleMode">Toggle Dark/Light</button>
      <button onclick="logout()"  id="logout"> Logout</button>
    </aside>

    <main class="main-content">
      <div class="card-container">

        <div class="card">
          <i class="fas fa-hammer card-icon"></i>
          <h3>Total Mining</h3>
          <p>Toant: <strong id="totalMiningDisplay">Loading...</strong></p>
        </div>

        <div class="card">
          <i class="fas fa-coins card-icon"></i>
          <h3>Total Earning</h3>
          <p>USDT: <strong id="totalEarningUsdt">Loading...</strong></p>
          <p>TON: <strong id="totalEarningTon">Loading...</strong></p>
        </div>

        <div class="card">
          <i class="fas fa-money-bill-wave card-icon"></i>
          <h3>Total Withdraw</h3>
          <p>USD: <strong id="totalWithdrawUsd">Loading...</strong></p>
          <p>TON: <strong id="totalWithdrawTon">Loading...</strong></p>
        </div>

        <div class="card">
          <i class="fas fa-user-friends card-icon"></i>
          <h3>Referral Link</h3>
          <input type="text" id="refLink" placeholder="Loading referral link..." readonly /> 
          <button onclick="copyRefLink()">Copy Referral Link</button>
          <a href="#" class="btn-secondary" onclick="friend(event)">~ Go to earning board</a>
        </div>
        <div class="card" id="dailyLoginCard">
          <i class="fas fa-gift card-icon"></i>
          <h3>Daily Login</h3>
          <button id="claimBtn" class="claim-button">Claim</button>
          <p id="dailyClaimMessage" style="font-size: 0.9em; margin-top: 5px;"></p>
        </div>

      </div>
    </main>
  </div>

  <script src="/Clint/assest/js/dashboard.js"></script>
</body>
</html>
